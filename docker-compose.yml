version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: invoiceflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: invoiceflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema/00_master.sql:/docker-entrypoint-initdb.d/00_master.sql:ro
      - ./schema/01_bootstrap_structure.sql:/docker-entrypoint-initdb.d/01_bootstrap_structure.sql:ro
      - ./schema/02_views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
      - ./schema/03_partitions.sql:/docker-entrypoint-initdb.d/03_partitions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: invoiceflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build: .
    container_name: invoiceflow-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/invoiceflow
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-SUPER_INVOICEFLOW_SECRET_32_CHARS_MIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
